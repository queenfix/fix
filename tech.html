<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <title>بوابة مهندسي الصيانة</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .container { max-width: 600px; margin: 0 auto; }
    .box { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    h2, h3 { margin-top: 0; color: #38bdf8; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 1rem; }
    .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.95rem; color: #fff; width: 100%; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; width: auto; }
    .btn-save { background: #16a34a; }
    .btn-wa { background: #16a34a; text-decoration: none; display: inline-block; }
    .btn-ready { background: #0284c7; text-decoration: none; display: inline-block; }
    .btn-call { background: #0d9488; text-decoration: none; display: inline-block; }
    .btn-out { background: #475569; width: auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { padding: 6px 12px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: #cbd5e1; font-size: 0.82rem; cursor: pointer; font-weight: bold; }
    .chip.active { background: #0284c7; border-color: #0284c7; color: #fff; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 14px; border-right: 5px solid #f59e0b; }
    .meta { font-size: 0.9rem; color: #94a3b8; margin-bottom: 10px; line-height: 1.6; }
    .timeline-mini { font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; line-height: 1.6; }
    .reminder-box { background: #7c2d12; color: #ffedd5; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem; border: 1px solid #fb923c; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .checks label { background: #0f172a; padding: 5px 9px; border-radius: 6px; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
    .checks input { width: auto; margin: 0; }
    .thumb { width: 85px; height: 85px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginView" class="box" style="max-width:400px; margin: 40px auto;">
      <h2>دخول مهندسي الصيانة</h2>
      <input type="text" id="username" placeholder="اسم المستخدم (Username)">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button class="btn" style="background:#0284c7;" onclick="handleLogin()">دخول</button>
      <p id="loginErr" style="color:#f87171; font-size:0.9rem;"></p>
    </div>

    <div id="workView" style="display:none;">
      <div class="topbar">
        <span id="techTitle" style="font-weight:bold; color:#38bdf8;"></span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-sm" style="background:#0284c7;" onclick="toggleQuickAdd()">+ إضافة جهاز</button>
          <button class="btn btn-sm btn-out" onclick="auth.signOut()">خروج</button>
        </div>
      </div>

      <div id="quickAddBox" class="box" style="display:none;">
        <h3>إضافة جهاز سريع</h3>
        <input type="text" id="qName" placeholder="اسم العميل">
        <input type="tel" id="qPhone" placeholder="رقم الموبايل">
        <input type="text" id="qType" placeholder="نوع الجهاز">
        <textarea id="qIssue" rows="2" placeholder="وصف العطل"></textarea>
        <textarea id="qInternalNotes" rows="2" placeholder="ملاحظات داخلية للمهندسين فقط"></textarea>
        <div class="checks">
          <label><input type="checkbox" value="بطارية"> بطارية</label>
          <label><input type="checkbox" value="شاحن/كابل باور"> شاحن/باور</label>
          <label><input type="checkbox" value="شنطة"> شنطة</label>
          <label><input type="checkbox" value="دراع تحكم"> دراع</label>
          <label><input type="checkbox" value="كابل HDMI"> كابل HDMI</label>
        </div>
        <label style="font-size:0.85rem; color:#94a3b8;">تصوير الجهاز (اختياري):</label>
        <input type="file" id="qPhoto" accept="image/*" capture="environment">
        <button class="btn btn-save" onclick="addQuickTicket()">حفظ الجهاز</button>
      </div>

      <div class="box" style="padding:12px;">
        <input type="text" id="techSearch" style="margin:0;" placeholder="بحث سريع بالاسم، الموبايل، أو الكود..." oninput="renderTechTickets()">
      </div>

      <div class="filter-bar" id="techStatusFilters">
        <button class="chip active" onclick="setTechFilter('all', this)">الكل</button>
        <button class="chip" onclick="setTechFilter('working', this)">قيد الفحص</button>
        <button class="chip" onclick="setTechFilter('parts', this)">انتظار قطع غيار</button>
        <button class="chip" onclick="setTechFilter('done', this)">جاهز للتسليم</button>
        <button class="chip" onclick="setTechFilter('rejected', this)">مرفوض</button>
      </div>

      <div id="myTickets"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    let currentEmail = '';
    let currentTechFilter = 'all';
    let latestTechDocs = [];
    let isFirstLoad = true;
    const knownDocIds = new Set();

    function setTechFilter(st, btnEl) {
      currentTechFilter = st;
      document.querySelectorAll('#techStatusFilters .chip').forEach(c => c.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderTechTickets();
    }

    function handleLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      loginWithUsername(u, p).then(() => {
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
      }).catch(() => {
        document.getElementById('loginErr').innerText = "بيانات الدخول غير صحيحة";
      });
    }

    function toggleQuickAdd() {
      const box = document.getElementById('quickAddBox');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        currentEmail = user.email;
        isFirstLoad = true;
        knownDocIds.clear();
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
        const entry = Object.values(USERS_MAP).find(x => x.email === user.email);
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('workView').style.display = 'block';
        document.getElementById('techTitle').innerText = "مهام المهندس: " + (entry ? entry.name : user.email);
        subscribeMyWork(user.email);
      } else {
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('workView').style.display = 'none';
      }
    });

    function addQuickTicket() {
      const cName = document.getElementById('qName').value.trim();
      const cPhone = document.getElementById('qPhone').value.trim();
      const dType = document.getElementById('qType').value.trim();
      const dIssue = document.getElementById('qIssue').value.trim();
      const internalNotes = document.getElementById('qInternalNotes').value.trim();
      const photoFile = document.getElementById('qPhoto').files[0];

      if (!cName || !cPhone || !dType || !dIssue) {
        alert("أكمل الاسم والموبايل والجهاز والعطل");
        return;
      }

      const entry = Object.values(USERS_MAP).find(x => x.email === currentEmail);
      const techName = entry ? entry.name : currentEmail;

      readImageAsCompressedBase64(photoFile, (photoBase64) => {
        const accs = Array.from(document.querySelectorAll('#quickAddBox .checks input:checked')).map(c => c.value).join(' - ');
        const ticketId = "FIX-" + Math.floor(1000 + Math.random() * 9000);

        db.collection('tickets').add({
          ticketId, customerName: cName, phone: cPhone, deviceType: dType,
          serial: '', issue: dIssue, accessories: accs || 'لا يوجد',
          photoBase64: photoBase64 || '',
          techEmail: currentEmail, techName, status: 'new',
          finalCost: 0, partsCost: 0, publicNotes: '', internalNotes,
          reminderDisabled: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          readyAt: null,
          deliveredAt: null
        }).then(() => {
          alert("تم إضافة الجهاز: " + ticketId);
          document.getElementById('qName').value = '';
          document.getElementById('qPhone').value = '';
          document.getElementById('qType').value = '';
          document.getElementById('qIssue').value = '';
          document.getElementById('qInternalNotes').value = '';
          document.getElementById('qPhoto').value = '';
          toggleQuickAdd();
        });
      });
    }

    function matchesTechSearch(d, query) {
      if (!query) return true;
      const q = query.trim().toLowerCase();
      const code = (d.ticketId || '').toLowerCase();
      const digitsOnly = q.replace(/^fix-?/, '');
      const codeMatch = code.includes(q) || (digitsOnly && code.endsWith('-' + digitsOnly));
      const nameMatch = (d.customerName || '').toLowerCase().includes(q);
      const phoneMatch = (d.phone || '').toLowerCase().includes(q);
      const deviceMatch = (d.deviceType || '').toLowerCase().includes(q);
      return codeMatch || nameMatch || phoneMatch || deviceMatch;
    }

    function subscribeMyWork(email) {
      db.collection('tickets').onSnapshot(snap => {
        latestTechDocs = [];
        snap.forEach(doc => {
          const d = doc.data();
          if (!isFirstLoad && !knownDocIds.has(doc.id) && d.techEmail === email && d.status !== 'delivered') {
            triggerNewDeviceNotification(d);
          }
          knownDocIds.add(doc.id);
          if (d.status === 'delivered') return;

          const isMine = d.techEmail === email;
          const isAhmedCoveringYoussef = (email === 'ahmedshaheen@shop.local' && d.techEmail === 'beytibee@shop.local');
          if (!isMine && !isAhmedCoveringYoussef) return;

          latestTechDocs.push({ id: doc.id, data: d });
        });

        isFirstLoad = false;
        renderTechTickets();
      });
    }

    function renderTechTickets() {
      const container = document.getElementById('myTickets');
      const searchVal = document.getElementById('techSearch').value;
      container.innerHTML = '';
      let count = 0;

      latestTechDocs.forEach(({ id, data: d }) => {
        if (currentTechFilter !== 'all' && d.status !== currentTechFilter) return;
        if (!matchesTechSearch(d, searchVal)) return;
        count++;

        const cycle = getReminderCycle(d.createdAt);
        const showReminder = (!d.reminderDisabled && cycle >= 1 && (
          (currentEmail === 'amrataallah@shop.local' && d.techEmail === 'amrataallah@shop.local') ||
          (currentEmail === 'ahmedshaheen@shop.local' && (d.techEmail === 'ahmedshaheen@shop.local' || d.techEmail === 'beytibee@shop.local'))
        ));

        const waPhone = d.phone.startsWith('0') ? '2' + d.phone : d.phone;
        const siteUrl = window.location.href.replace('tech.html', 'index.html') + '?q=' + d.ticketId;
        const waMsg = encodeURIComponent(`أهلاً أ/ ${d.customerName}\nبخصوص جهازك (${d.deviceType}) - كود ${d.ticketId}\nيمكنك متابعة الحالة من هنا:\n${siteUrl}`);
        const readyMsg = encodeURIComponent(`أهلاً أ/ ${d.customerName}\nتم إصلاح جهازك (${d.deviceType}) - كود ${d.ticketId} وهو جاهز للاستلام.\nالتكلفة النهائية: ${d.finalCost || 0} ج.م\nتفاصيل المتابعة:\n${siteUrl}`);

        const isAmrOrAhmed = (currentEmail === 'amrataallah@shop.local' || currentEmail === 'ahmedshaheen@shop.local');
        const showReadyAlertBtn = isAmrOrAhmed && d.status === 'done';

        const createdStr = formatDateTime(d.createdAt);
        const readyStr = formatDateTime(d.readyAt);

        container.innerHTML += `
          <div class="card">
            ${showReminder ? `<div class="reminder-box">تذكير رقم (${cycle}): مر ${cycle * 7} أيام أو أكثر على استلام الجهاز، يرجى الاتصال بالعميل (${d.customerName} - ${d.phone}).</div>` : ''}
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <strong style="font-size:1.1rem; color:#fff;">${d.deviceType}</strong>
              <span style="color:#38bdf8; font-weight:bold;">${d.ticketId}</span>
            </div>
            <div class="meta">
              <strong>العميل:</strong> ${d.customerName} (${d.phone})<br>
              <strong>المسؤول:</strong> ${d.techName}<br>
              <strong>العطل:</strong> ${d.issue}<br>
              <strong>الملحقات:</strong> ${d.accessories}
            </div>
            ${(createdStr || readyStr) ? `
              <div class="timeline-mini">
                ${createdStr ? `استلام: ${createdStr}` : ''}
                ${readyStr ? ` | جاهز: ${readyStr}` : ''}
              </div>
            ` : ''}
            ${d.photoBase64 ? `<img src="${d.photoBase64}" class="thumb" alt="صورة الجهاز">` : ''}

            <label style="font-size:0.85rem; color:#cbd5e1;">حالة الصيانة:</label>
            <select id="st_${id}">
              <option value="new" ${d.status==='new'?'selected':''}>تم الاستلام</option>
              <option value="working" ${d.status==='working'?'selected':''}>جاري الفحص والصيانة</option>
              <option value="parts" ${d.status==='parts'?'selected':''}>في انتظار قطع غيار</option>
              <option value="done" ${d.status==='done'?'selected':''}>تم الإصلاح - جاهز للاستلام</option>
              <option value="rejected" ${d.status==='rejected'?'selected':''}>لا يمكن الإصلاح / مرفوض</option>
            </select>

            <div style="display:flex; gap:8px;">
              <div style="flex:1;">
                <label style="font-size:0.85rem; color:#cbd5e1;">سعر الصيانة للزبون:</label>
                <input type="number" id="fc_${id}" value="${d.finalCost || 0}">
              </div>
              <div style="flex:1;">
                <label style="font-size:0.85rem; color:#cbd5e1;">تكلفة قطع الغيار:</label>
                <input type="number" id="pc_${id}" value="${d.partsCost || 0}">
              </div>
            </div>

            <label style="font-size:0.85rem; color:#cbd5e1;">تقرير الصيانة (يظهر للزبون):</label>
            <textarea id="nt_${id}" rows="2" placeholder="مثال: تم تغيير آيسي الشحن وتنظيف البوردة...">${d.publicNotes || ''}</textarea>

            <label style="font-size:0.85rem; color:#fbbf24;">ملاحظات داخلية للمهندسين فقط (لا تظهر للزبون):</label>
            <textarea id="in_${id}" rows="2" placeholder="ملاحظة فنية أو مكان قطعة غيار...">${d.internalNotes || ''}</textarea>

            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <button class="btn btn-save" style="flex:1;" onclick="updateTicket('${id}')">حفظ وتحديث الحالة</button>
              <a href="tel:${d.phone}" class="btn btn-sm btn-call">اتصال</a>
              ${isAmrOrAhmed ? `<a href="https://wa.me/${waPhone}?text=${waMsg}" target="_blank" class="btn btn-sm btn-wa">واتساب</a>` : ''}
              ${showReadyAlertBtn ? `<a href="https://wa.me/${waPhone}?text=${readyMsg}" target="_blank" class="btn btn-sm btn-ready">تنبيه جاهز للاستلام</a>` : ''}
            </div>
          </div>
        `;
      });

      if (count === 0) {
        container.innerHTML = '<div class="box"><p style="text-align:center; margin:0; color:#94a3b8;">لا توجد أجهزة مطابقة للبحث أو الفلتر الحالي.</p></div>';
      }
    }

    function updateTicket(docId) {
      const status = document.getElementById('st_' + docId).value;
      const finalCost = Number(document.getElementById('fc_' + docId).value) || 0;
      const partsCost = Number(document.getElementById('pc_' + docId).value) || 0;
      const publicNotes = document.getElementById('nt_' + docId).value.trim();
      const internalNotes = document.getElementById('in_' + docId).value.trim();

      const updateObj = { status, finalCost, partsCost, publicNotes, internalNotes };
      if (status === 'done') {
        updateObj.readyAt = firebase.firestore.FieldValue.serverTimestamp();
      }

      db.collection('tickets').doc(docId).update(updateObj).then(() => {
        alert("تم تحديث حالة الجهاز بنجاح!");
      });
    }
  </script>
</body>
</html>
