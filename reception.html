<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <title>الاستقبال والإدارة</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .container { max-width: 700px; margin: 0 auto; }
    .box { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    h2, h3 { margin-top: 0; color: #38bdf8; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 1rem; }
    .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.95rem; color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; }
    .btn-primary { background: #0284c7; width: 100%; }
    .btn-print { background: #475569; }
    .btn-sticker { background: #7c3aed; }
    .btn-deliver { background: #2563eb; }
    .btn-warn { background: #b45309; }
    .btn-ok { background: #15803d; }
    .btn-call { background: #0d9488; text-decoration: none; display: inline-block; }
    .checks { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .checks label { background: #0f172a; padding: 6px 10px; border-radius: 6px; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .checks input { width: auto; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stat-card { background: #0f172a; padding: 12px; border-radius: 8px; }
    .stat-card strong { display: block; font-size: 1.2rem; color: #38bdf8; }
    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { padding: 6px 12px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: #cbd5e1; font-size: 0.82rem; cursor: pointer; font-weight: bold; }
    .chip.active { background: #0284c7; border-color: #0284c7; color: #fff; }
    .ticket-card { background: #1e293b; padding: 14px; border-radius: 10px; margin-bottom: 12px; border-right: 4px solid #38bdf8; }
    .internal-note { background: #0f172a; border-right: 3px solid #f59e0b; padding: 8px 10px; border-radius: 6px; margin-top: 8px; font-size: 0.85rem; color: #fde68a; }
    .timeline-mini { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; line-height: 1.6; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; margin-top: 6px; border: 1px solid #334155; }
    #printArea { display: none; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { display: block; position: absolute; left: 0; top: 0; width: 72mm; color: #000; background: #fff; font-family: monospace; padding: 4px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginView" class="box" style="max-width:400px; margin: 40px auto;">
      <h2>دخول الاستقبال / الإدارة</h2>
      <input type="text" id="username" placeholder="اسم المستخدم (Username)">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button class="btn btn-primary" onclick="handleLogin()">دخول</button>
      <p id="loginErr" style="color:#f87171; font-size:0.9rem;"></p>
    </div>

    <div id="mainView" style="display:none;">
      <div class="topbar">
        <span id="welcomeUser" style="font-weight:bold; color:#38bdf8;"></span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-sm" style="background:#0284c7;" onclick="scrollToForm()">+ إضافة جهاز</button>
          <button class="btn btn-sm btn-print" onclick="auth.signOut()">خروج</button>
        </div>
      </div>

      <div id="adminPanel" class="box" style="display:none;">
        <h3>ملخص الحسابات (الأجهزة المسلمة)</h3>
        <div class="stats">
          <div class="stat-card"><span>إجمالي الإيراد</span><strong id="totRev">0</strong></div>
          <div class="stat-card"><span>قطع الغيار</span><strong id="totParts" style="color:#f87171;">0</strong></div>
          <div class="stat-card"><span>صافي الربح</span><strong id="totNet" style="color:#4ade80;">0</strong></div>
        </div>
      </div>

      <div id="addFormBox" class="box">
        <h3>استلام جهاز جديد</h3>
        <input type="text" id="cName" placeholder="اسم العميل">
        <input type="tel" id="cPhone" placeholder="رقم الموبايل (مثال: 010xxxxxxxx)">
        <input type="text" id="dType" placeholder="نوع الجهاز والموديل (مثال: PS4 Slim / لابتوب Dell)">
        <input type="text" id="dSerial" placeholder="السيريال نمبر (اختياري)">
        <textarea id="dIssue" rows="2" placeholder="وصف العطل"></textarea>
        <textarea id="dInternalNotes" rows="2" placeholder="ملاحظات داخلية للفنيين والإدارة فقط (لا تظهر للعميل)"></textarea>

        <label style="font-size:0.9rem; color:#94a3b8;">الملحقات المستلمة مع الجهاز:</label>
        <div class="checks">
          <label><input type="checkbox" value="بطارية"> بطارية</label>
          <label><input type="checkbox" value="شاحن/كابل باور"> شاحن/باور</label>
          <label><input type="checkbox" value="شنطة"> شنطة</label>
          <label><input type="checkbox" value="دراع تحكم"> دراع</label>
          <label><input type="checkbox" value="كابل HDMI"> كابل HDMI</label>
          <label><input type="checkbox" value="بدون ملحقات"> بدون ملحقات</label>
        </div>

        <label style="font-size:0.9rem; color:#94a3b8;">تصوير الجهاز (اختياري):</label>
        <input type="file" id="dPhoto" accept="image/*" capture="environment">

        <label style="font-size:0.9rem; color:#94a3b8;">المهندس المسؤول:</label>
        <select id="techSelect">
          <option value="ahmedshaheen@shop.local|أحمد شاهين">أحمد شاهين</option>
          <option value="amrataallah@shop.local|عمرو عطاالله">عمرو عطاالله</option>
          <option value="beytibee@shop.local|يوسف أيمن">يوسف أيمن (صيانة سريعة)</option>
        </select>

        <input type="number" id="estCost" placeholder="التكلفة المبدئية (اختياري)">
        <button class="btn btn-primary" onclick="addTicket()">حفظ وتسجيل الجهاز</button>
      </div>

      <div class="box">
        <h3>متابعة الأجهزة</h3>
        <input type="text" id="quickSearch" placeholder="بحث سريع بالاسم، الموبايل، أو الكود..." oninput="renderReceptionList()">

        <select id="filterTech" onchange="renderReceptionList()">
          <option value="all">كل المهندسين</option>
          <option value="ahmedshaheen@shop.local">أحمد شاهين</option>
          <option value="amrataallah@shop.local">عمرو عطاالله</option>
          <option value="beytibee@shop.local">يوسف أيمن</option>
        </select>

        <div class="filter-bar" id="statusFilters">
          <button class="chip active" onclick="setStatusFilter('all', this)">الكل</button>
          <button class="chip" onclick="setStatusFilter('working', this)">قيد الفحص</button>
          <button class="chip" onclick="setStatusFilter('parts', this)">انتظار قطع غيار</button>
          <button class="chip" onclick="setStatusFilter('done', this)">جاهز للتسليم</button>
          <button class="chip" onclick="setStatusFilter('delivered', this)">تم التسليم</button>
          <button class="chip" onclick="setStatusFilter('rejected', this)">مرفوض</button>
        </div>

        <div id="ticketsList"></div>
      </div>
    </div>
  </div>

  <div id="printArea"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    let currentUserRole = '';
    let currentStatusFilter = 'all';
    let latestDocs = [];

    const statusText = {
      'new': 'تم الاستلام', 'working': 'جاري الصيانة', 'parts': 'انتظار قطع غيار',
      'done': 'جاهز للاستلام', 'delivered': 'تم التسليم', 'rejected': 'مرفوض'
    };

    function scrollToForm() {
      document.getElementById('addFormBox').scrollIntoView({ behavior: 'smooth' });
    }

    function setStatusFilter(st, btnEl) {
      currentStatusFilter = st;
      document.querySelectorAll('#statusFilters .chip').forEach(c => c.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderReceptionList();
    }

    function handleLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      loginWithUsername(u, p).catch(() => {
        document.getElementById('loginErr').innerText = "خطأ في الاسم أو كلمة المرور";
      });
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        const entry = Object.values(USERS_MAP).find(x => x.email === user.email);
        if (!entry || (entry.role !== 'reception' && entry.role !== 'admin')) {
          alert("هذا الحساب مخصص لمهندسي الصيانة فقط. استخدم صفحة المهندسين.");
          auth.signOut();
          return;
        }
        currentUserRole = entry.role;
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('mainView').style.display = 'block';
        document.getElementById('welcomeUser').innerText = "مرحباً: " + entry.name;
        if (entry.role === 'admin') {
          document.getElementById('adminPanel').style.display = 'block';
        }
        subscribeTickets();
      } else {
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('mainView').style.display = 'none';
      }
    });

    function addTicket() {
      const cName = document.getElementById('cName').value.trim();
      const cPhone = document.getElementById('cPhone').value.trim();
      const dType = document.getElementById('dType').value.trim();
      const dSerial = document.getElementById('dSerial').value.trim();
      const dIssue = document.getElementById('dIssue').value.trim();
      const internalNotes = document.getElementById('dInternalNotes').value.trim();
      const estCost = Number(document.getElementById('estCost').value) || 0;
      const [techEmail, techName] = document.getElementById('techSelect').value.split('|');
      const photoFile = document.getElementById('dPhoto').files[0];

      if (!cName || !cPhone || !dType || !dIssue) {
        alert("من فضلك أكمل البيانات الأساسية (الاسم، الموبايل، الجهاز، العطل)");
        return;
      }

      readImageAsCompressedBase64(photoFile, (photoBase64) => {
        const accs = Array.from(document.querySelectorAll('.checks input:checked')).map(c => c.value).join(' - ');
        const ticketId = "FIX-" + Math.floor(1000 + Math.random() * 9000);

        db.collection('tickets').add({
          ticketId, customerName: cName, phone: cPhone, deviceType: dType,
          serial: dSerial, issue: dIssue, accessories: accs || 'لا يوجد',
          photoBase64: photoBase64 || '',
          techEmail, techName, status: 'new',
          finalCost: estCost, partsCost: 0, publicNotes: '', internalNotes,
          reminderDisabled: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          readyAt: null,
          deliveredAt: null
        }).then(() => {
          alert("تم تسجيل الجهاز بنجاح! كود المتابعة: " + ticketId);
          document.getElementById('cName').value = '';
          document.getElementById('cPhone').value = '';
          document.getElementById('dType').value = '';
          document.getElementById('dSerial').value = '';
          document.getElementById('dIssue').value = '';
          document.getElementById('dInternalNotes').value = '';
          document.getElementById('estCost').value = '';
          document.getElementById('dPhoto').value = '';
          document.querySelectorAll('.checks input:checked').forEach(c => c.checked = false);
        });
      });
    }

    function subscribeTickets() {
      db.collection('tickets').orderBy('createdAt', 'desc').onSnapshot(snap => {
        latestDocs = [];
        let rev = 0, parts = 0;

        snap.forEach(doc => {
          const d = doc.data();
          latestDocs.push({ id: doc.id, data: d });
          if (d.status === 'delivered') {
            rev += Number(d.finalCost || 0);
            parts += Number(d.partsCost || 0);
          }
        });

        document.getElementById('totRev').innerText = rev + ' ج.م';
        document.getElementById('totParts').innerText = parts + ' ج.م';
        document.getElementById('totNet').innerText = (rev - parts) + ' ج.م';
        renderReceptionList();
      });
    }

    function matchesSearch(d, query) {
      if (!query) return true;
      const q = query.trim().toLowerCase();
      const code = (d.ticketId || '').toLowerCase();
      const digitsOnly = q.replace(/^fix-?/, '');
      const codeMatch = code.includes(q) || (digitsOnly && code.endsWith('-' + digitsOnly));
      const nameMatch = (d.customerName || '').toLowerCase().includes(q);
      const phoneMatch = (d.phone || '').toLowerCase().includes(q);
      const deviceMatch = (d.deviceType || '').toLowerCase().includes(q);
      return codeMatch || nameMatch || phoneMatch || deviceMatch;
    }

    function renderReceptionList() {
      const techFilter = document.getElementById('filterTech').value;
      const searchVal = document.getElementById('quickSearch').value;
      const list = document.getElementById('ticketsList');
      list.innerHTML = '';

      latestDocs.forEach(({ id, data: d }) => {
        if (techFilter !== 'all' && d.techEmail !== techFilter) return;
        if (currentStatusFilter !== 'all' && d.status !== currentStatusFilter) return;
        if (!matchesSearch(d, searchVal)) return;

        const reminderBtn = currentUserRole === 'admin' && d.status !== 'delivered'
          ? `<button class="btn btn-sm ${d.reminderDisabled ? 'btn-ok' : 'btn-warn'}" onclick="toggleReminder('${id}', ${!d.reminderDisabled})">${d.reminderDisabled ? 'تفعيل التذكير' : 'إلغاء التذكير'}</button>`
          : '';

        const createdStr = formatDateTime(d.createdAt);
        const readyStr = formatDateTime(d.readyAt);
        const deliveredStr = formatDateTime(d.deliveredAt);

        list.innerHTML += `
          <div class="ticket-card">
            <div style="display:flex; justify-content:space-between;">
              <strong>${d.ticketId} - ${d.customerName}</strong>
              <span style="color:#38bdf8;">${statusText[d.status]}</span>
            </div>
            <div style="font-size:0.9rem; color:#cbd5e1; margin:6px 0;">
              الموبايل: <span dir="ltr">${d.phone}</span> | الجهاز: ${d.deviceType}<br>
              العطل: ${d.issue} | الملحقات: ${d.accessories}<br>
              المهندس: ${d.techName} | التكلفة: ${d.finalCost} ج.م
              ${d.reminderDisabled ? '<br><span style="color:#fbbf24;">تم إلغاء تذكير الاتصال لهذا العميل</span>' : ''}
            </div>
            ${d.internalNotes ? `<div class="internal-note"><strong>ملاحظة داخلية:</strong> ${d.internalNotes}</div>` : ''}
            <div class="timeline-mini">
              ${createdStr ? `استلام: ${createdStr}` : ''}
              ${readyStr ? ` | جاهز: ${readyStr}` : ''}
              ${deliveredStr ? ` | تسليم: ${deliveredStr}` : ''}
            </div>
            ${d.photoBase64 ? `<img src="${d.photoBase64}" class="thumb" alt="صورة الجهاز">` : ''}
            <div class="actions">
              <a href="tel:${d.phone}" class="btn btn-sm btn-call">اتصال بالعميل</a>
              <button class="btn btn-sm btn-print" onclick='printCustomerReceipt(${JSON.stringify(d.ticketId)}, ${JSON.stringify(d.customerName)}, ${JSON.stringify(d.phone)}, ${JSON.stringify(d.deviceType)}, ${JSON.stringify(d.issue)}, ${JSON.stringify(d.accessories)}, ${JSON.stringify(d.finalCost)})'>طباعة ريسيت</button>
              <button class="btn btn-sm btn-sticker" onclick='printDeviceSticker(${JSON.stringify(d.ticketId)}, ${JSON.stringify(d.customerName)}, ${JSON.stringify(d.deviceType)}, ${JSON.stringify(d.issue)}, ${JSON.stringify(d.accessories)}, ${JSON.stringify(d.techName)})'>طباعة استيكر</button>
              ${d.status !== 'delivered' ? `<button class="btn btn-sm btn-deliver" onclick="markDelivered('${id}', ${d.finalCost})">تسليم وتحصيل</button>` : ''}
              ${d.techEmail === 'beytibee@shop.local' && d.status !== 'delivered' ? `<button class="btn btn-sm" style="background:#0284c7;" onclick="quickFinish('${id}')">إنهاء صيانة يوسف</button>` : ''}
              ${reminderBtn}
            </div>
          </div>
        `;
      });
    }

    function toggleReminder(docId, disableState) {
      db.collection('tickets').doc(docId).update({ reminderDisabled: disableState });
    }

    function markDelivered(docId, currentCost) {
      const finalAmt = prompt("أكد المبلغ المحصل من العميل (ج.م):", currentCost);
      if (finalAmt !== null) {
        db.collection('tickets').doc(docId).update({
          status: 'delivered',
          finalCost: Number(finalAmt),
          deliveredAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }

    function quickFinish(docId) {
      const cost = prompt("اكتب تكلفة الصيانة النهائية:");
      const note = prompt("ملاحظة للعميل (اختياري):") || "تم الإصلاح بنجاح";
      if (cost !== null) {
        db.collection('tickets').doc(docId).update({
          status: 'done',
          finalCost: Number(cost),
          publicNotes: note,
          readyAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }

    function printCustomerReceipt(ticketId, customerName, phone, deviceType, issue, accessories, finalCost) {
      const p = document.getElementById('printArea');
      p.innerHTML = `
        <div style="text-align:center; border-bottom:1px dashed #000; padding-bottom:6px;">
          <h3 style="margin:0;">إيصال استلام صيانة</h3>
          <p style="margin:4px 0;">كود: <strong>${ticketId}</strong></p>
        </div>
        <p>العميل: ${customerName}</p>
        <p>الموبايل: ${phone}</p>
        <p>الجهاز: ${deviceType}</p>
        <p>العطل: ${issue}</p>
        <p>الملحقات: ${accessories}</p>
        <p>التكلفة المبدئية: ${finalCost ? finalCost + ' ج.م' : 'بعد الفحص'}</p>
        <hr>
        <p style="font-size:11px; text-align:center;">يرجى الاحتفاظ بالإيصال عند الاستلام</p>
      `;
      window.print();
    }

    function printDeviceSticker(ticketId, customerName, deviceType, issue, accessories, techName) {
      const p = document.getElementById('printArea');
      p.innerHTML = `
        <div style="border:2px solid #000; padding:6px; border-radius:4px;">
          <div style="display:flex; justify-content:space-between; border-bottom:1px solid #000; padding-bottom:4px; margin-bottom:4px;">
            <strong>${ticketId}</strong>
            <span>${techName}</span>
          </div>
          <div style="font-size:12px;"><strong>العميل:</strong> ${customerName}</div>
          <div style="font-size:12px;"><strong>الجهاز:</strong> ${deviceType}</div>
          <div style="font-size:12px;"><strong>العطل:</strong> ${issue}</div>
          <div style="font-size:11px;"><strong>الملحقات:</strong> ${accessories}</div>
        </div>
      `;
      window.print();
    }
  </script>
</body>
</html>
